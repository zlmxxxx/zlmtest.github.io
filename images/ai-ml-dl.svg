<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-label="人工智能、机器学习与深度学习的包含关系示意图">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif; }
    .bg { fill: #0d0f14; } .t { fill: #f4f4f5; } .m { fill: #a1a1aa; } .s { fill: #71717a; }
    .ln { stroke: #3a3f4d; } .ac { fill: #818cf8; } .ac2 { fill: #22d3ee; }
    .c1 { fill: #818cf8; fill-opacity: .07; stroke: #818cf8; stroke-opacity: .5; }
    .c2 { fill: #818cf8; fill-opacity: .12; stroke: #818cf8; stroke-opacity: .7; }
    .g1 { stop-color: #818cf8; } .g2 { stop-color: #22d3ee; }
    @media (prefers-color-scheme: light) {
      .bg { fill: #ffffff; } .t { fill: #18181b; } .m { fill: #52525b; } .s { fill: #71717a; }
      .ln { stroke: #d4d4d8; } .ac { fill: #4f46e5; } .ac2 { fill: #0891b2; }
      .c1 { fill: #4f46e5; fill-opacity: .05; stroke: #4f46e5; stroke-opacity: .4; }
      .c2 { fill: #4f46e5; fill-opacity: .09; stroke: #4f46e5; stroke-opacity: .6; }
      .g1 { stop-color: #4f46e5; } .g2 { stop-color: #0891b2; }
    }
  </style>
  <defs>
    <linearGradient id="dl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" class="g1"/><stop offset="1" class="g2"/>
    </linearGradient>
  </defs>
  <rect class="bg" width="800" height="420"/>

  <circle class="c1" cx="330" cy="215" r="190" stroke-width="1.5"/>
  <circle class="c2" cx="330" cy="250" r="135" stroke-width="1.5"/>
  <circle cx="330" cy="285" r="80" fill="url(#dl)" fill-opacity=".9"/>

  <text class="t" x="330" y="62" font-size="20" font-weight="700" text-anchor="middle">人工智能 AI</text>
  <text class="m" x="330" y="86" font-size="13" text-anchor="middle">规则系统 · 搜索 · 专家系统 · 机器学习…</text>
  <text class="t" x="330" y="150" font-size="18" font-weight="700" text-anchor="middle">机器学习</text>
  <text class="m" x="330" y="172" font-size="13" text-anchor="middle">决策树 · 支持向量机 · 聚类 · 神经网络</text>
  <text x="330" y="280" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">深度学习</text>
  <text x="330" y="304" font-size="13" text-anchor="middle" fill="#ffffff" fill-opacity=".85">多层神经网络 · 大模型</text>

  <!-- 右侧时间标注 -->
  <g stroke-width="1" stroke-dasharray="4 4">
    <line class="ln" x1="470" y1="70" x2="600" y2="70"/>
    <line class="ln" x1="440" y1="160" x2="600" y2="160"/>
    <line class="ln" x1="400" y1="285" x2="600" y2="285"/>
  </g>
  <circle class="ac" cx="600" cy="70" r="4"/>
  <circle class="ac" cx="600" cy="160" r="4"/>
  <circle class="ac2" cx="600" cy="285" r="4"/>
  <text class="t" x="614" y="66" font-size="15" font-weight="600">1956 年</text>
  <text class="s" x="614" y="86" font-size="12">达特茅斯会议提出概念</text>
  <text class="t" x="614" y="156" font-size="15" font-weight="600">1980s 起</text>
  <text class="s" x="614" y="176" font-size="12">从数据中学习规律</text>
  <text class="t" x="614" y="281" font-size="15" font-weight="600">2012 年爆发</text>
  <text class="s" x="614" y="301" font-size="12">GPU + 大数据驱动</text>
</svg>
