<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-label="AI 作为通用技术辐射九大行业的示意图">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif; }
    .bg { fill: #0d0f14; } .node { fill: #151821; stroke: #2a2e3a; } .t { fill: #f4f4f5; } .m { fill: #a1a1aa; } .s { fill: #71717a; }
    .ln { stroke: #818cf8; stroke-opacity: .35; } .ring { stroke: #818cf8; stroke-opacity: .12; } .ac { fill: #818cf8; }
    .g1 { stop-color: #818cf8; } .g2 { stop-color: #22d3ee; }
    @media (prefers-color-scheme: light) {
      .bg { fill: #ffffff; } .node { fill: #f6f6f8; stroke: #e4e4e7; } .t { fill: #18181b; } .m { fill: #52525b; } .s { fill: #71717a; }
      .ln { stroke: #4f46e5; stroke-opacity: .3; } .ring { stroke: #4f46e5; stroke-opacity: .1; } .ac { fill: #4f46e5; }
      .g1 { stop-color: #4f46e5; } .g2 { stop-color: #0891b2; }
    }
  </style>
  <defs>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" class="g1"/><stop offset="1" class="g2"/>
    </linearGradient>
  </defs>
  <rect class="bg" width="800" height="430"/>

  <ellipse class="ring" cx="400" cy="215" rx="250" ry="160" fill="none" stroke-width="1.5" stroke-dasharray="6 6"/>
  <ellipse class="ring" cx="400" cy="215" rx="140" ry="90" fill="none" stroke-width="1.5"/>

  <g stroke-width="1.5">
    <line class="ln" x1="400" y1="215" x2="400" y2="55"/>
    <line class="ln" x1="400" y1="215" x2="560.7" y2="92.4"/>
    <line class="ln" x1="400" y1="215" x2="646.2" y2="187.2"/>
    <line class="ln" x1="400" y1="215" x2="616.5" y2="295"/>
    <line class="ln" x1="400" y1="215" x2="485.5" y2="365.4"/>
    <line class="ln" x1="400" y1="215" x2="314.5" y2="365.4"/>
    <line class="ln" x1="400" y1="215" x2="183.5" y2="295"/>
    <line class="ln" x1="400" y1="215" x2="153.8" y2="187.2"/>
    <line class="ln" x1="400" y1="215" x2="239.3" y2="92.4"/>
  </g>

  <circle cx="400" cy="215" r="64" fill="url(#core)"/>
  <text x="400" y="212" font-size="24" font-weight="800" text-anchor="middle" fill="#ffffff">AI</text>
  <text x="400" y="236" font-size="12.5" text-anchor="middle" fill="#ffffff" fill-opacity=".9">通用目的技术</text>

  <g text-anchor="middle">
    <rect class="node" x="338" y="30" width="124" height="50" rx="12"/>
    <text class="t" x="400" y="52" font-size="14.5" font-weight="700">医疗健康</text><text class="m" x="400" y="70" font-size="11.5">影像 · 病历 · 新药</text>

    <rect class="node" x="498.7" y="67.4" width="124" height="50" rx="12"/>
    <text class="t" x="560.7" y="89.4" font-size="14.5" font-weight="700">金融</text><text class="m" x="560.7" y="107.4" font-size="11.5">风控 · 投研 · 客服</text>

    <rect class="node" x="584.2" y="162.2" width="124" height="50" rx="12"/>
    <text class="t" x="646.2" y="184.2" font-size="14.5" font-weight="700">制造业</text><text class="m" x="646.2" y="202.2" font-size="11.5">质检 · 维护 · 机器人</text>

    <rect class="node" x="554.5" y="270" width="124" height="50" rx="12"/>
    <text class="t" x="616.5" y="292" font-size="14.5" font-weight="700">教育</text><text class="m" x="616.5" y="310" font-size="11.5">答疑 · 批改 · 备课</text>

    <rect class="node" x="423.5" y="340.4" width="124" height="50" rx="12"/>
    <text class="t" x="485.5" y="362.4" font-size="14.5" font-weight="700">交通出行</text><text class="m" x="485.5" y="380.4" font-size="11.5">自动驾驶 · 物流</text>

    <rect class="node" x="252.5" y="340.4" width="124" height="50" rx="12"/>
    <text class="t" x="314.5" y="362.4" font-size="14.5" font-weight="700">零售电商</text><text class="m" x="314.5" y="380.4" font-size="11.5">推荐 · 购物智能体</text>

    <rect class="node" x="121.5" y="270" width="124" height="50" rx="12"/>
    <text class="t" x="183.5" y="292" font-size="14.5" font-weight="700">软件开发</text><text class="m" x="183.5" y="310" font-size="11.5">编程智能体</text>

    <rect class="node" x="91.8" y="162.2" width="124" height="50" rx="12"/>
    <text class="t" x="153.8" y="184.2" font-size="14.5" font-weight="700">内容媒体</text><text class="m" x="153.8" y="202.2" font-size="11.5">多模态生成</text>

    <rect class="node" x="177.3" y="67.4" width="124" height="50" rx="12"/>
    <text class="t" x="239.3" y="89.4" font-size="14.5" font-weight="700">政务服务</text><text class="m" x="239.3" y="107.4" font-size="11.5">智能问答 · 审核</text>
  </g>
  <text class="s" x="400" y="418" font-size="12" text-anchor="middle">像电力与互联网一样，AI 正在成为渗透各行各业的通用目的技术</text>
</svg>
