<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="AI 能独立完成的软件任务时长（METR 50% 时间跨度）对数坐标图：从 2019 年约 2 秒增长到 2026 年约 12 至 20 小时">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif; }
    .bg { fill: #0d0f14; } .t { fill: #f4f4f5; } .m { fill: #a1a1aa; } .s { fill: #71717a; } .ac { fill: #818cf8; } .ac2 { fill: #22d3ee; }
    .grid { stroke: #22252e; } .trend { stroke: #818cf8; } .trend2 { stroke: #22d3ee; } .dot { fill: #0d0f14; stroke: #818cf8; } .ceil { stroke: #fbbf24; } .ceilt { fill: #fbbf24; }
    @media (prefers-color-scheme: light) {
      .bg { fill: #ffffff; } .t { fill: #18181b; } .m { fill: #52525b; } .s { fill: #71717a; } .ac { fill: #4f46e5; } .ac2 { fill: #0891b2; }
      .grid { stroke: #ececef; } .trend { stroke: #4f46e5; } .trend2 { stroke: #0891b2; } .dot { fill: #ffffff; stroke: #4f46e5; } .ceil { stroke: #d97706; } .ceilt { fill: #b45309; }
    }
  </style>
  <rect class="bg" width="800" height="340"/>

  <text class="t" x="30" y="28" font-size="15" font-weight="700">AI 能独立完成多长的任务？（50% 成功率，对数坐标）</text>

  <!-- 横向网格与刻度 -->
  <g stroke-width="1">
    <line class="grid" x1="70" y1="268.7" x2="770" y2="268.7"/>
    <line class="grid" x1="70" y1="188.8" x2="770" y2="188.8"/>
    <line class="grid" x1="70" y1="143.9" x2="770" y2="143.9"/>
    <line class="grid" x1="70" y1="108.9" x2="770" y2="108.9"/>
    <line class="grid" x1="70" y1="68.3" x2="770" y2="68.3"/>
  </g>
  <g class="s" font-size="11.5" text-anchor="end">
    <text x="62" y="272.7">1 秒</text><text x="62" y="192.8">1 分钟</text><text x="62" y="147.9">10 分钟</text>
    <text x="62" y="112.9">1 小时</text><text x="62" y="72.3">8 小时</text>
  </g>

  <!-- 测量上限 -->
  <line class="ceil" x1="70" y1="54.8" x2="770" y2="54.8" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text class="ceilt" x="76" y="49" font-size="11">约 16 小时：现有任务集的可靠测量上限</text>

  <!-- 趋势线 -->
  <line class="trend" x1="81.7" y1="255.2" x2="625.3" y2="115.5" stroke-width="2" stroke-dasharray="6 5"/>
  <line class="trend2" x1="625.3" y1="109.2" x2="735" y2="57" stroke-width="2" stroke-dasharray="6 5"/>
  <text class="ac" x="290" y="190" font-size="12.5" font-weight="600" transform="rotate(-14.4 290 190)">2019—2024：约每 7 个月翻一番</text>
  <text class="ac2" x="560" y="150" font-size="12" font-weight="600">2024 年以来：约每 3—4 个月翻一番</text>

  <!-- 数据点 -->
  <g stroke-width="2.5">
    <circle class="dot" cx="81.7" cy="255.2" r="5"/>
    <circle class="dot" cx="625.3" cy="109.2" r="5"/>
    <circle class="dot" cx="638.9" cy="100.8" r="5"/>
    <circle class="dot" cx="666" cy="85.1" r="5"/>
    <circle class="dot" cx="713.9" cy="60.4" r="5"/>
    <circle class="dot" cx="729.2" cy="52.5" r="6"/>
  </g>
  <g font-size="11.5">
    <text class="t" x="94" y="252" font-weight="600">GPT-2（2019）约 2 秒</text>
    <text class="m" x="612" y="122" text-anchor="end">Claude 3.7 Sonnet（2025.2）约 1 小时</text>
    <text class="m" x="626" y="100" text-anchor="end">o3（2025.4）约 1.5 小时</text>
    <text class="m" x="653" y="84" text-anchor="end">GPT-5（2025.8）约 3.4 小时</text>
    <text class="m" x="701" y="64" text-anchor="end">Claude Opus 4.6（2026.2）约 12 小时</text>
    <text class="t" x="742" y="40" font-weight="700" text-anchor="end">2026 前沿：约 16—20 小时</text>
  </g>

  <g class="m" font-size="12" text-anchor="middle">
    <text x="70" y="292">2019</text><text x="160.3" y="292">2020</text><text x="250.6" y="292">2021</text>
    <text x="340.9" y="292">2022</text><text x="431.2" y="292">2023</text><text x="521.5" y="292">2024</text>
    <text x="611.8" y="292">2025</text><text x="702.1" y="292">2026</text>
  </g>
  <text class="s" x="30" y="322" font-size="11">数据：METR 时间跨度研究（2025 年论文、2026 年 Time Horizon 1.1 及前沿风险报告），各数据点来自不同版本任务集，仅示意量级与趋势</text>
</svg>
