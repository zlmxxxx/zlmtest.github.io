<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="AI 未来路线图：现在、1 至 3 年、3 至 10 年的发展阶段示意">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif; }
    .bg { fill: #0d0f14; } .panel { fill: #151821; stroke: #2a2e3a; } .t { fill: #f4f4f5; } .m { fill: #a1a1aa; } .s { fill: #71717a; }
    .ac { fill: #818cf8; } .ac2 { fill: #22d3ee; } .road { stroke: #818cf8; } .dot { fill: #0d0f14; stroke: #818cf8; } .fog { fill: #818cf8; fill-opacity: .08; }
    .g1 { stop-color: #818cf8; stop-opacity: .15; } .g2 { stop-color: #22d3ee; }
    @media (prefers-color-scheme: light) {
      .bg { fill: #ffffff; } .panel { fill: #f6f6f8; stroke: #e4e4e7; } .t { fill: #18181b; } .m { fill: #52525b; } .s { fill: #71717a; }
      .ac { fill: #4f46e5; } .ac2 { fill: #0891b2; } .road { stroke: #4f46e5; } .dot { fill: #ffffff; stroke: #4f46e5; } .fog { fill: #4f46e5; fill-opacity: .05; }
      .g1 { stop-color: #4f46e5; stop-opacity: .15; } .g2 { stop-color: #0891b2; }
    }
  </style>
  <defs>
    <linearGradient id="road" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" class="g1"/><stop offset="1" class="g2"/>
    </linearGradient>
  </defs>
  <rect class="bg" width="800" height="340"/>

  <ellipse class="fog" cx="705" cy="56" rx="85" ry="42"/>
  <text class="ac2" x="705" y="52" font-size="16" font-weight="700" text-anchor="middle">AGI ？</text>
  <text class="s" x="705" y="72" font-size="11.5" text-anchor="middle">定义与时间表仍有争议</text>

  <path d="M40 300 C200 300 240 230 360 210 S560 150 650 100" fill="none" stroke="url(#road)" stroke-width="6" stroke-linecap="round"/>
  <path d="M650 100 L672 90" class="road" fill="none" stroke-width="3" stroke-dasharray="4 6" stroke-linecap="round"/>

  <g stroke-width="3">
    <circle class="dot" cx="120" cy="296" r="9"/>
    <circle class="dot" cx="360" cy="210" r="9"/>
    <circle class="dot" cx="590" cy="128" r="9"/>
  </g>

  <!-- 阶段说明卡片 -->
  <rect class="panel" x="40" y="150" width="200" height="104" rx="12"/>
  <text class="ac" x="56" y="176" font-size="12.5" font-weight="700">现在 · 2026</text>
  <text class="t" x="56" y="200" font-size="14" font-weight="600">智能体进入企业流程</text>
  <text class="m" x="56" y="222" font-size="12">编程、客服、办公率先落地</text>
  <text class="m" x="56" y="240" font-size="12">人形机器人开始量产</text>

  <rect class="panel" x="270" y="40" width="220" height="122" rx="12"/>
  <text class="ac" x="286" y="66" font-size="12.5" font-weight="700">近期 · 1—3 年</text>
  <text class="t" x="286" y="90" font-size="14" font-weight="600">长时程"数字员工"</text>
  <text class="m" x="286" y="112" font-size="12">智能体独立完成数天级任务</text>
  <text class="m" x="286" y="130" font-size="12">机器人在工厂、仓储批量部署</text>
  <text class="m" x="286" y="148" font-size="12">AI 内置于手机与操作系统</text>

  <rect class="panel" x="470" y="186" width="230" height="122" rx="12"/>
  <text class="ac" x="486" y="212" font-size="12.5" font-weight="700">中长期 · 3—10 年</text>
  <text class="t" x="486" y="236" font-size="14" font-weight="600">人机协作新范式</text>
  <text class="m" x="486" y="258" font-size="12">多智能体协作网络</text>
  <text class="m" x="486" y="276" font-size="12">AI + 自动化实验室加速科研</text>
  <text class="m" x="486" y="294" font-size="12">跨国治理框架逐步成熟</text>

  <text class="s" x="40" y="330" font-size="11.5">趋势判断基于公开信息整理，并非确定性预测</text>
</svg>
