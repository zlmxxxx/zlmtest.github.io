<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="使用 AI 的企业组织比例：2018 至 2022 年在约 50% 至 60% 之间徘徊，2023 年 55%，2024 年 78%，2025 年 88%">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif; }
    .bg { fill: #0d0f14; } .t { fill: #f4f4f5; } .m { fill: #a1a1aa; } .s { fill: #71717a; } .ac { fill: #818cf8; } .ac2 { fill: #22d3ee; }
    .grid { stroke: #22252e; } .line { stroke: #818cf8; } .mark { stroke: #22d3ee; } .dot { fill: #0d0f14; stroke: #818cf8; }
    .band { fill: #818cf8; fill-opacity: .12; stroke: #818cf8; stroke-opacity: .35; } .hollow { fill: #0d0f14; stroke: #71717a; }
    .g1 { stop-color: #818cf8; } .g0 { stop-color: #818cf8; stop-opacity: 0; }
    @media (prefers-color-scheme: light) {
      .bg { fill: #ffffff; } .t { fill: #18181b; } .m { fill: #52525b; } .s { fill: #71717a; } .ac { fill: #4f46e5; } .ac2 { fill: #0891b2; }
      .grid { stroke: #ececef; } .line { stroke: #4f46e5; } .mark { stroke: #0891b2; } .dot { fill: #ffffff; stroke: #4f46e5; }
      .band { fill: #4f46e5; fill-opacity: .08; stroke: #4f46e5; stroke-opacity: .3; } .hollow { fill: #ffffff; stroke: #a1a1aa; }
      .g1 { stop-color: #4f46e5; } .g0 { stop-color: #4f46e5; stop-opacity: 0; }
    }
  </style>
  <defs>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" class="g1" stop-opacity=".35"/><stop offset="1" class="g0"/>
    </linearGradient>
  </defs>
  <rect class="bg" width="800" height="340"/>

  <text class="t" x="30" y="32" font-size="15" font-weight="700">使用 AI 的企业组织比例（2017—2025）</text>

  <g stroke-width="1">
    <line class="grid" x1="70" y1="270" x2="770" y2="270"/>
    <line class="grid" x1="70" y1="215" x2="770" y2="215"/>
    <line class="grid" x1="70" y1="160" x2="770" y2="160"/>
    <line class="grid" x1="70" y1="105" x2="770" y2="105"/>
    <line class="grid" x1="70" y1="50" x2="770" y2="50"/>
  </g>
  <g class="s" font-size="11.5" text-anchor="end">
    <text x="58" y="274">0%</text><text x="58" y="219">25%</text><text x="58" y="164">50%</text><text x="58" y="109">75%</text><text x="58" y="54">100%</text>
  </g>

  <!-- 2018—2022 平台期：约 50%—60% -->
  <rect class="band" x="140" y="138" width="377" height="22" rx="6" stroke-width="1" stroke-dasharray="4 3"/>
  <text class="m" x="328.5" y="128" font-size="12" text-anchor="middle">2018—2022 年：约 50%—60% 的平台期</text>

  <!-- 2017：定义不同，单独标注 -->
  <circle class="hollow" cx="70" cy="226" r="5" stroke-width="2"/>
  <text class="m" x="84" y="222" font-size="12.5" font-weight="600">约 20%</text>
  <text class="s" x="84" y="240" font-size="11">定义更严格</text>

  <!-- ChatGPT 发布标记 -->
  <line class="mark" x1="578" y1="50" x2="578" y2="270" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text class="ac2" x="584" y="64" font-size="12">2022.11 ChatGPT 发布</text>

  <!-- 2023—2025 -->
  <path d="M587.5 149 L673.75 98.4 L760 76.4 L760 270 L587.5 270 Z" fill="url(#area)"/>
  <polyline class="line" points="587.5,149 673.75,98.4 760,76.4" fill="none" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <g stroke-width="2.5">
    <circle class="dot" cx="587.5" cy="149" r="5"/>
    <circle class="dot" cx="673.75" cy="98.4" r="5"/>
    <circle class="dot" cx="760" cy="76.4" r="6"/>
  </g>
  <g class="t" font-size="12.5" font-weight="600" text-anchor="middle">
    <text x="600" y="172">55%</text><text x="673.75" y="85">78%</text><text x="748" y="63" class="ac" font-size="14">88%</text>
  </g>

  <g class="m" font-size="12" text-anchor="middle">
    <text x="70" y="292">2017</text><text x="156.25" y="292">2018</text><text x="242.5" y="292">2019</text>
    <text x="328.75" y="292">2020</text><text x="415" y="292">2021</text><text x="501.25" y="292">2022</text>
    <text x="587.5" y="292">2023</text><text x="673.75" y="292">2024</text><text x="760" y="292">2025</text>
  </g>
  <text class="s" x="30" y="322" font-size="11.5">数据：麦肯锡全球 AI 调查，经斯坦福 HAI《AI Index》2025、2026 年版整理；各年"采用"定义有调整，早期数据仅供参考</text>
</svg>
