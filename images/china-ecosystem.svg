<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="中国人工智能产业生态分层图：算力、模型、应用与具身智能，由政策贯穿引导">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif; }
    .bg { fill: #0d0f14; } .t { fill: #f4f4f5; } .m { fill: #a1a1aa; } .s { fill: #71717a; } .ac { fill: #818cf8; }
    .l1 { fill: #818cf8; fill-opacity: .08; stroke: #818cf8; stroke-opacity: .3; }
    .l2 { fill: #818cf8; fill-opacity: .14; stroke: #818cf8; stroke-opacity: .45; }
    .l3 { fill: #22d3ee; fill-opacity: .12; stroke: #22d3ee; stroke-opacity: .45; }
    .l4 { fill: #22d3ee; fill-opacity: .2; stroke: #22d3ee; stroke-opacity: .6; }
    .pol { fill: #f472b6; fill-opacity: .1; stroke: #f472b6; stroke-opacity: .5; } .polt { fill: #f9a8d4; }
    @media (prefers-color-scheme: light) {
      .bg { fill: #ffffff; } .t { fill: #18181b; } .m { fill: #52525b; } .s { fill: #71717a; } .ac { fill: #4f46e5; }
      .l1 { fill: #4f46e5; fill-opacity: .05; stroke: #4f46e5; stroke-opacity: .25; }
      .l2 { fill: #4f46e5; fill-opacity: .09; stroke: #4f46e5; stroke-opacity: .35; }
      .l3 { fill: #0891b2; fill-opacity: .08; stroke: #0891b2; stroke-opacity: .35; }
      .l4 { fill: #0891b2; fill-opacity: .13; stroke: #0891b2; stroke-opacity: .5; }
      .pol { fill: #db2777; fill-opacity: .06; stroke: #db2777; stroke-opacity: .4; } .polt { fill: #be185d; }
    }
  </style>
  <rect class="bg" width="800" height="400"/>

  <!-- 自下而上的四层 -->
  <polygon class="l1" points="40,370 640,370 610,300 70,300"/>
  <polygon class="l2" points="74,290 606,290 576,220 104,220"/>
  <polygon class="l3" points="108,210 572,210 542,140 138,140"/>
  <polygon class="l4" points="142,130 538,130 508,60 172,60"/>

  <g text-anchor="middle">
    <text class="t" x="340" y="92" font-size="16" font-weight="700">具身智能</text>
    <text class="m" x="340" y="114" font-size="12.5">人形机器人 · 智能制造 · 物流分拣</text>

    <text class="t" x="340" y="172" font-size="16" font-weight="700">应用层</text>
    <text class="m" x="340" y="194" font-size="12.5">AI 助手 · 智能体手机 · 办公 · 客服 · 工业质检</text>

    <text class="t" x="340" y="252" font-size="16" font-weight="700">模型层</text>
    <text class="m" x="340" y="274" font-size="12.5">DeepSeek · 通义千问 · Kimi · GLM · 豆包 · 文心 · 混元</text>

    <text class="t" x="340" y="332" font-size="16" font-weight="700">算力层</text>
    <text class="m" x="340" y="354" font-size="12.5">国产 AI 芯片 · 智算中心 · "东数西算"工程</text>
  </g>

  <!-- 政策贯穿 -->
  <rect class="pol" x="672" y="60" width="96" height="310" rx="14"/>
  <g class="polt" font-size="15" font-weight="700" text-anchor="middle">
    <text x="720" y="128">政</text><text x="720" y="150">策</text><text x="720" y="172">引</text><text x="720" y="194">导</text>
  </g>
  <g class="m" font-size="11.5" text-anchor="middle">
    <text x="720" y="236">人工智能+</text><text x="720" y="254">行动</text>
    <text x="720" y="290">生成式 AI</text><text x="720" y="308">管理办法</text>
    <text x="720" y="340">内容标识</text>
  </g>

  <text class="s" x="40" y="36" font-size="12.5">中国 AI 产业生态（示意）：底层算力支撑模型，模型驱动应用与具身智能</text>
</svg>
